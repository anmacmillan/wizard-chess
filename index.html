<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0b10">
<title>Wizard Chess</title>
<link rel="icon" href="pieces/wN.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Wizard Chess">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #d9b45a; --gold2: #f3d98b; --ink: #efe6d2; --dim: #a99f8c;
    --bs: 480px; --frame: 12px;
    --title: "Cinzel", "Trajan Pro", Georgia, serif;
    --body: "EB Garamond", Georgia, serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; touch-action: manipulation; }
  body {
    font-family: var(--body); color: var(--ink);
    background: radial-gradient(ellipse at 50% 35%, #2b2231 0%, #150f18 55%, #070609 100%);
    user-select: none; -webkit-user-select: none;
  }
  /* candlelight at the edges of the chamber */
  body::before, body::after {
    content: ""; position: fixed; top: 10%; width: 50vmax; height: 50vmax; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,160,60,.16) 0%, rgba(255,120,30,0) 65%);
    pointer-events: none; animation: flicker 3.2s infinite alternate ease-in-out; z-index: 0;
  }
  body::before { left: -22vmax; }
  body::after { right: -22vmax; animation-delay: -1.7s; }
  @keyframes flicker { 0%{opacity:.75} 30%{opacity:1} 55%{opacity:.82} 80%{opacity:.97} 100%{opacity:.86} }

  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  #app {
    position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    height: 48px; padding: 0 14px; flex: none;
  }
  .brand { font-family: var(--title); font-weight: 900; letter-spacing: 3px; font-size: 18px; color: var(--gold); text-shadow: 0 0 12px rgba(217,180,90,.35); }
  .icons { display: flex; gap: 6px; }
  .icon {
    width: 38px; height: 38px; border-radius: 50%; font-size: 18px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(217,180,90,.25);
  }
  .icon.off { opacity: .35; }

  main {
    flex: 1; display: grid; justify-content: center; align-content: center; gap: 10px;
    grid-template-areas: "ptop" "board" "pbot" "action";
    padding: 0 16px 10px;
  }
  body.wide main {
    grid-template-areas: "board ptop" "board action" "board pbot";
    grid-template-columns: auto 300px; grid-template-rows: auto 1fr auto; column-gap: 22px;
  }
  #frame { grid-area: board; }
  #pTop { grid-area: ptop; }
  #pBot { grid-area: pbot; }
  #action { grid-area: action; }
  #pTop, #pBot, #action { width: calc(var(--bs) + var(--frame) * 2); }
  body.wide #pTop, body.wide #pBot, body.wide #action { width: 300px; }

  /* ---------- Board ---------- */
  #frame {
    padding: var(--frame); border-radius: 10px;
    background: linear-gradient(145deg, #4a4239, #241f1b 60%, #3a332c);
    box-shadow: 0 25px 60px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.12), 0 0 0 1px #000;
  }
  #board { position: relative; width: var(--bs); height: var(--bs); touch-action: none; }
  #frame { padding: 0 !important; background: none !important; box-shadow: 0 25px 70px rgba(0,0,0,.75), 0 0 0 1px rgba(217,180,90,.35) !important; border-radius: 12px; }
  .coach { text-align: left; padding: 10px 12px; border-radius: 12px; color: #3b2a14; font-size: 15.5px; line-height: 1.35;
    background: radial-gradient(ellipse at 30% 20%, #f1e4c6, #d9c49a 90%); box-shadow: inset 0 0 18px rgba(120,80,30,.3); }
  .coach b { font-family: var(--title); font-size: 14px; display: block; margin-bottom: 2px; }
  .coach .ph { float: right; font-style: italic; font-size: 13px; opacity: .7; }
  .hrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 6px 0 4px; }
  .lgroup { font-family: var(--title); color: var(--gold); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; margin: 14px 0 4px; }
  .lesson { display: flex; justify-content: space-between; width: 100%; text-align: left; padding: 10px 12px; margin-top: 6px; border-radius: 10px; background: rgba(255,255,255,.05); font-size: 17px; }
  .lesson .tick { color: #7be38a; }
  .hrow button { padding: 8px 2px; border-radius: 10px; font-family: var(--title); font-size: 12px; font-weight: 700; color: var(--ink);
    background: rgba(255,255,255,.06); border: 2px solid transparent; }
  .hrow button.on { border-color: var(--gold); background: rgba(217,180,90,.18); }
  .hrow .sw { display: block; height: 8px; border-radius: 4px; margin: 0 auto 4px; width: 70%; background: linear-gradient(90deg, var(--c1) 50%, var(--c2) 50%); }
  #squares { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); box-shadow: 0 0 0 2px #15110e; }
  .sq { position: relative; }
  .sq.l { background: linear-gradient(135deg, #b3ab9c 0%, #9c9587 55%, #a7a092 100%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.18), inset 2px 2px 4px rgba(255,255,255,.12); }
  .sq.d { background: linear-gradient(135deg, #4a4850 0%, #35333a 55%, #403e46 100%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.35), inset 2px 2px 4px rgba(255,255,255,.05); }
  .sq.last::before { content: ""; position: absolute; inset: 0; background: rgba(230,180,60,.32); }
  .sq.sel::before { content: ""; position: absolute; inset: 0; background: rgba(120,200,255,.32); box-shadow: inset 0 0 0 3px rgba(150,220,255,.8); }
  .sq.dot::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 28%; height: 28%; transform: translate(-50%,-50%);
    border-radius: 50%; background: radial-gradient(circle, rgba(170,230,255,.95), rgba(90,170,255,.4) 60%, transparent 72%);
    box-shadow: 0 0 10px rgba(120,200,255,.7); z-index: 3; pointer-events: none;
  }
  .sq.cap::after {
    content: ""; position: absolute; inset: 6%; border-radius: 50%;
    box-shadow: inset 0 0 0 4px rgba(255,90,60,.85), 0 0 12px rgba(255,90,60,.7); z-index: 3; pointer-events: none;
  }
  .sq.check::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,40,30,.85) 0%, rgba(255,40,30,.3) 55%, transparent 75%); }
  .coord { position: absolute; font-family: var(--title); font-weight: 700; font-size: calc(var(--bs) * .022); pointer-events: none; opacity: .75; }
  .coord.f { right: 4%; bottom: 2%; }
  .coord.r { left: 4%; top: 2%; }
  .sq.l .coord { color: #3a3630; }
  .sq.d .coord { color: #b9b2a5; }

  #pieces { position: absolute; inset: 0; pointer-events: none; }
  .pc { position: absolute; width: 12.5%; height: 12.5%; z-index: 2; will-change: left, top; }
  .pc img { width: 100%; height: 100%; display: block; }
  .pc.w img { filter: sepia(.35) saturate(.8) brightness(.98) drop-shadow(0 calc(var(--bs) * .006) calc(var(--bs) * .004) rgba(0,0,0,.65)); }
  .pc.b img { filter: drop-shadow(0 0 1.5px rgba(230,210,170,.45)) drop-shadow(0 calc(var(--bs) * .006) calc(var(--bs) * .004) rgba(0,0,0,.75)); }
  .shard { position: absolute; width: 12.5%; height: 12.5%; z-index: 6; pointer-events: none; }
  .shard img { width: 100%; height: 100%; display: block; }
  .dust { position: absolute; width: 12.5%; height: 12.5%; z-index: 5; pointer-events: none; border-radius: 50%;
    background: radial-gradient(circle, rgba(220,205,180,.75) 0%, rgba(160,150,130,.35) 45%, transparent 70%); }

  /* ---------- Player panels ---------- */
  .player {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; min-height: 56px;
    background: rgba(0,0,0,.35); border-radius: 12px; border: 1px solid rgba(255,255,255,.06);
    transition: box-shadow .4s, border-color .4s;
  }
  .player.turn { border-color: rgba(217,180,90,.7); box-shadow: 0 0 18px rgba(217,180,90,.3); }
  .crest {
    width: 38px; height: 44px; flex: none; display: grid; place-items: center;
    font-family: var(--title); font-weight: 900; font-size: 18px; color: var(--c2);
    background: linear-gradient(160deg, var(--c1), color-mix(in srgb, var(--c1) 60%, #000));
    border: 2px solid var(--c2); border-radius: 6px 6px 50% 50% / 6px 6px 40% 40%;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .pinfo { flex: 1; min-width: 0; }
  .pname { font-family: var(--title); font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .phouse { font-size: 14px; color: var(--dim); font-style: italic; }
  .caps { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; max-width: 55%; }
  .caps img { width: 20px; height: 20px; margin-left: -5px; }
  .adv { font-family: var(--title); font-size: 13px; color: var(--gold); margin-left: 4px; }

  /* ---------- Action area ---------- */
  #action { display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: 8px; min-height: 70px; text-align: center; }
  .status { font-family: var(--title); font-size: 18px; font-weight: 700; color: var(--gold2); }
  .status.big { font-size: 26px; }
  .sub { font-size: 16px; color: var(--dim); font-style: italic; }
  .btn {
    font-family: var(--title); font-weight: 700; font-size: 17px; letter-spacing: .5px;
    padding: 13px 18px; border-radius: 12px; color: #2a1d08;
    background: linear-gradient(180deg, #f3d98b, #c9a043); box-shadow: 0 4px 0 #7d5f1f, 0 8px 18px rgba(0,0,0,.4);
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #7d5f1f; }
  .btn.ghost { background: rgba(255,255,255,.06); color: var(--ink); box-shadow: none; border: 1px solid rgba(217,180,90,.35); font-size: 15px; padding: 10px 14px; }
  .btn.pulse { animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 4px 0 #7d5f1f, 0 0 0 0 rgba(243,217,139,.6);} 50% { box-shadow: 0 4px 0 #7d5f1f, 0 0 0 10px rgba(243,217,139,0);} }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  /* ---------- Overlays ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
    background: rgba(5,4,8,.78); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); padding: 16px;
  }
  .overlay.show { display: flex; }
  .card {
    width: min(440px, 100%); max-height: 100%; overflow-y: auto; padding: 22px 20px;
    background: linear-gradient(180deg, #221b24, #151017); border: 1px solid rgba(217,180,90,.45);
    border-radius: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.7);
  }
  .card h1 { font-family: var(--title); font-weight: 900; color: var(--gold); text-align: center; font-size: 30px; letter-spacing: 3px; }
  .card h2 { font-family: var(--title); color: var(--gold2); font-size: 20px; margin-bottom: 10px; }
  .card .tag { text-align: center; color: var(--dim); font-style: italic; margin: 4px 0 16px; font-size: 17px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-family: var(--title); font-size: 13px; letter-spacing: 1px; color: var(--dim); margin-bottom: 6px; text-transform: uppercase; }
  .field input[type=text] {
    width: 100%; font: inherit; font-size: 18px; padding: 10px 12px; border-radius: 10px; color: var(--ink);
    background: rgba(0,0,0,.4); border: 1px solid rgba(217,180,90,.35); outline: none; user-select: text; -webkit-user-select: text;
  }
  .field input[type=text]:focus { border-color: var(--gold); }
  .choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .choices.two { grid-template-columns: 1fr 1fr; }
  .choice {
    padding: 9px 4px; border-radius: 10px; font-size: 14px; font-family: var(--title); font-weight: 700;
    background: rgba(255,255,255,.05); border: 2px solid transparent; color: var(--ink);
  }
  .choice.on { border-color: var(--gold); background: rgba(217,180,90,.15); }
  .choice .sw { display: block; height: 8px; border-radius: 4px; margin: 0 auto 5px; width: 70%; background: linear-gradient(90deg, var(--c1) 50%, var(--c2) 50%); }
  .check-row { display: flex; align-items: center; gap: 10px; font-size: 17px; margin: 4px 0 16px; }
  .check-row input { width: 22px; height: 22px; accent-color: var(--gold); }
  .games { margin-top: 18px; border-top: 1px solid rgba(255,255,255,.08); padding-top: 14px; }
  .game {
    display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left;
    padding: 10px 12px; margin-top: 6px; border-radius: 10px; background: rgba(255,255,255,.05); font-size: 17px;
  }
  .game small { color: var(--dim); font-style: italic; }
  .codein { flex: 1; font: inherit; font-size: 20px; letter-spacing: 3px; text-transform: uppercase; padding: 10px 12px; border-radius: 10px; color: var(--ink);
    background: rgba(0,0,0,.4); border: 1px solid rgba(217,180,90,.35); outline: none; user-select: text; -webkit-user-select: text; min-width: 0; }
  .gcode { text-align: center; color: var(--dim); font-size: 16px; margin: -4px 0 6px; }
  .gcode b { font-family: var(--title); color: var(--gold2); letter-spacing: 2px; }

  /* the owl's letter */
  .letter {
    width: min(380px, 100%); padding: 30px 24px 24px; text-align: center; position: relative; color: #3b2a14;
    background: radial-gradient(ellipse at 50% 30%, #f1e4c6, #d9c49a 85%); border-radius: 6px;
    box-shadow: 0 30px 80px rgba(0,0,0,.8), inset 0 0 40px rgba(120,80,30,.35);
    animation: arrive .7s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes arrive { from { transform: translateY(-60vh) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .letter .owlicon { font-size: 54px; line-height: 1; margin-bottom: 8px; }
  .letter h2 { font-family: var(--title); font-weight: 900; font-size: 22px; margin-bottom: 8px; }
  .letter p { font-size: 18px; margin-bottom: 18px; font-style: italic; }
  .seal { position: absolute; right: 18px; top: 18px; width: 38px; height: 38px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, color-mix(in srgb, var(--c1) 70%, #fff), var(--c1) 60%, color-mix(in srgb, var(--c1) 60%, #000));
    box-shadow: 0 2px 4px rgba(0,0,0,.4); }

  #promo .card { text-align: center; }
  #promo .opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  #promo .opts button { background: rgba(255,255,255,.08); border-radius: 12px; padding: 6px; border: 1px solid rgba(217,180,90,.35); }
  #promo img { width: 100%; }

  #menu .card .btn, #log .card .btn { width: 100%; margin-top: 8px; }
  #moves { font-size: 18px; columns: 2; column-gap: 20px; margin-bottom: 8px; }
  #moves div { break-inside: avoid; padding: 2px 0; }
  #moves b { color: var(--dim); font-weight: 400; display: inline-block; width: 2.2em; }

  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 30px); opacity: 0;
    background: #f1e4c6; color: #3b2a14; padding: 10px 18px; border-radius: 10px; font-size: 17px; z-index: 80;
    transition: opacity .3s, transform .3s; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,.6); max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #stale {
    display: none; margin: 0 16px 8px; padding: 10px 14px; border-radius: 10px; font-size: 16px; text-align: center;
    background: rgba(255,120,60,.15); border: 1px solid rgba(255,140,80,.5);
  }
  #stale.show { display: block; }
  #stale button { text-decoration: underline; color: var(--gold2); font-weight: 600; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">WIZARD CHESS</div>
    <div class="icons">
      <button class="icon" data-act="sound" title="Sound">🔊</button>
      <button class="icon" data-act="voice" title="Spoken moves">🗣️</button>
      <button class="icon" data-act="coach" title="Professor Owl">🎓</button>
      <button class="icon" data-act="log" title="Moves">📜</button>
      <button class="icon" data-act="menu" title="Menu">⚙️</button>
    </div>
  </header>
  <div id="stale"></div>
  <main>
    <div class="player" id="pTop"></div>
    <div id="frame"><div id="board"></div></div>
    <div class="player" id="pBot"></div>
    <div id="action"></div>
  </main>
</div>

<!-- New game -->
<div class="overlay" id="setup">
  <div class="card">
    <h1>WIZARD CHESS</h1>
    <div class="tag">Play a friend by owl post. One move at a time.</div>
    <div class="field"><label for="myName">Your name</label><input type="text" id="myName" maxlength="20" autocomplete="off" placeholder="Manon"></div>
    <div class="field"><label>Your house</label><div class="choices" id="myHouse"></div></div>
    <div class="field"><label>You play</label>
      <div class="choices two" id="mySide">
        <button class="choice on" data-v="w">White · moves first</button>
        <button class="choice" data-v="b">Black</button>
      </div>
    </div>
    <div class="field"><label>Play against</label>
      <div class="choices two" id="vs">
        <button class="choice on" data-v="friend">👫 A friend</button>
        <button class="choice" data-v="bot">🤖 The computer</button>
      </div>
    </div>
    <div class="field" id="botField" style="display:none"><label>How clever?</label>
      <div class="choices" id="botLevel">
        <button class="choice on" data-v="1">🐣 Owlet<br><small>very easy</small></button>
        <button class="choice" data-v="2">🧚 Pixie<br><small>easy</small></button>
        <button class="choice" data-v="3">🧙 Wizard<br><small>tricky</small></button>
        <button class="choice" data-v="4">🐉 Dragon<br><small>super hard</small></button>
      </div>
    </div>
    <div class="field friendOnly"><label for="oppName">Your opponent</label><input type="text" id="oppName" maxlength="20" autocomplete="off" placeholder="Dad"></div>
    <div class="field"><label>Their house</label><div class="choices" id="oppHouse"></div></div>
    <label class="check-row friendOnly"><input type="checkbox" id="ppBox"> Both players on this iPad</label>
    <button class="btn" style="width:100%" id="beginBtn">Begin the game</button>
    <button class="btn ghost" style="width:100%;margin-top:10px" data-act="lessons">🎓 Lessons with Professor Owl</button>
    <div class="games" id="joinBox">
      <h2>Join a friend's game</h2>
      <div class="row"><input type="text" id="joinCode" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="Game code" class="codein"><button class="btn ghost" id="joinBtn" style="flex:none">Join</button></div>
      <div class="row" id="joinWho" style="margin-top:8px"></div>
    </div>
    <div class="games" id="games"></div>
  </div>
</div>

<!-- Owl arrival -->
<div class="overlay" id="owl">
  <div class="letter" id="letter">
    <div class="seal" id="seal"></div>
    <div class="owlicon">🦉</div>
    <h2 id="owlTitle"></h2>
    <p id="owlSub"></p>
    <button class="btn" id="owlBtn">Open the letter</button>
  </div>
</div>

<!-- Promotion -->
<div class="overlay" id="promo"><div class="card"><h2>Your pawn becomes…</h2><div class="opts" id="promoOpts"></div></div></div>

<!-- Menu -->
<div class="overlay" id="menu">
  <div class="card">
    <h2>Menu</h2>
    <div class="gcode" id="gcode"></div>
    <div class="sub" id="houseLabel" style="margin-top:4px">Your house</div>
    <div class="hrow" id="houseRow"></div>
    <button class="btn ghost" data-act="pieces" id="piecesBtn">Pieces: heroes</button>
    <button class="btn ghost" data-act="flip">Turn the board round</button>
    <button class="btn ghost" data-act="copy">Copy the game link</button>
    <button class="btn ghost" data-act="pp" id="ppBtn"></button>
    <button class="btn ghost" data-act="resign" id="resignBtn">Resign</button>
    <button class="btn ghost" data-act="lessons">🎓 Lessons</button>
    <button class="btn ghost" data-act="new">New game / my games</button>
    <button class="btn" data-act="close">Close</button>
  </div>
</div>

<!-- Move list -->
<div class="overlay" id="log"><div class="card"><h2>The moves so far</h2><div id="moves"></div><button class="btn" data-act="close">Close</button></div></div>

<!-- Lessons -->
<div class="overlay" id="lessonsOv"><div class="card"><h2>🎓 Lessons with Professor Owl</h2><div id="lessonList"></div><button class="btn" data-act="close" style="width:100%;margin-top:10px">Close</button></div></div>

<div id="toast"></div>

<script src="firebase-config.js"></script>
<script type="importmap">{ "imports": { "three": "./three.module.min.js" } }</script>
<script type="module">
import { Chess } from './chess.js';
import { Board3D } from './board3d.js';
import { LESSONS } from './lessons.js';

const $ = s => document.querySelector(s);
const HOUSES = {
  G: { name: 'Gryffindor', c1: '#ae0001', c2: '#eeba30' },
  S: { name: 'Slytherin',  c1: '#1a472a', c2: '#c0c0c0' },
  R: { name: 'Ravenclaw',  c1: '#222f5b', c2: '#b08d57' },
  H: { name: 'Hufflepuff', c1: '#d9a900', c2: '#372e29' },
};
const NAMES = { p: 'Pawn', n: 'Knight', b: 'Bishop', r: 'Rook', q: 'Queen', k: 'King' };
const VALUE = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
const MOVE_RE = /[a-h][1-8][a-h][1-8][QRBN]?/g;
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';   // no 0/O or 1/I/L to confuse
const newCode = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => CODE_CHARS[b % CODE_CHARS.length]).join('');
const other = s => (s === 'w' ? 'b' : 'w');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const img = (color, type) => `pieces/${color}${type.toUpperCase()}.svg`;

// ---------- storage (may be unavailable in private mode) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} backupSoon(); },
};
// ---------- cloud backup: the games list, lessons and settings, so a forgetful iPad loses nothing ----------
// A personal link ?p=NAME restores them on any iPad.
const BACKUP = 'https://wizard-chess-manon-default-rtdb.europe-west1.firebasedatabase.app/wcp/';
const KEYS = ['wc:games', 'wc:lessons', 'wc:prefs'];
const pCode = (new URLSearchParams(location.search).get('p') || store.get('wc:code', '') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
let backupTimer = null;
function backupNow() {
  clearTimeout(backupTimer); backupTimer = null;
  if (!pCode) return;
  const body = { t: Date.now() };
  for (const k of KEYS) body[k.slice(3)] = JSON.stringify(store.get(k, null));   // stored as text: Firebase reshapes lists
  try { localStorage.setItem('wc:backupT', JSON.stringify(body.t)); } catch (e) {}
  try { fetch(BACKUP + pCode + '.json', { method: 'PUT', body: JSON.stringify(body), keepalive: true }).catch(() => {}); } catch (e) {}
}
function backupSoon() { if (pCode && !backupTimer) backupTimer = setTimeout(backupNow, 3000); }
if (pCode) {
  try { localStorage.setItem('wc:code', JSON.stringify(pCode)); } catch (e) {}
  try {
    const r = await fetch(BACKUP + pCode + '.json', { cache: 'no-store' });
    const c = r.ok ? await r.json() : null;
    if (c && (c.t || 0) > store.get('wc:backupT', 0)) {   // the cloud copy is newer than this iPad's: use it
      for (const k of KEYS) if (c[k.slice(3)] && c[k.slice(3)] !== 'null') try { localStorage.setItem(k, c[k.slice(3)]); } catch (e) {}
      try { localStorage.setItem('wc:backupT', JSON.stringify(c.t)); } catch (e) {}
    }
  } catch (e) {}
  setInterval(backupNow, 30000);
  addEventListener('pagehide', backupNow);
  document.addEventListener('visibilitychange', () => { if (document.hidden) backupNow(); });
}
const prefs = Object.assign({ sound: true, voice: true, coach: true, pieces: 'heroes', name: '', house: 'G', oppHouse: 'S' }, store.get('wc:prefs', {}));
const board3d = new Board3D(document.getElementById('board'), { style: prefs.pieces, onTap: sq => { unlockAudio(); handleTap(sq); }, sfx: (n, a) => sfx(n, a) });

// ---------- the game lives in the link ----------
function parseHash() {
  const h = location.hash.slice(1);
  if (!h) return null;
  const p = new URLSearchParams(h);
  const id = p.get('id');
  if (!id) return null;
  const house = v => (HOUSES[v] ? v : 'G');
  return {
    id,
    w: { n: (p.get('wn') || 'White').slice(0, 20), h: house(p.get('wh')) },
    b: { n: (p.get('bn') || 'Black').slice(0, 20), h: house(p.get('bh')) },
    r: p.get('r') === 'w' || p.get('r') === 'b' ? p.get('r') : null,
    bot: BOTS[+p.get('bot')] ? +p.get('bot') : 0,
    // promotions are capitals (e7e8Q) so they can't be confused with the next move's file letter
    moves: (p.get('m') || '').match(MOVE_RE) || [],
  };
}
function uciList() { return chess.history({ verbose: true }).map(m => m.from + m.to + (m.promotion || '').toUpperCase()); }
function hashOf() {
  const p = new URLSearchParams({ id: G.id, wn: G.w.n, wh: G.w.h, bn: G.b.n, bh: G.b.h, m: uciList().join('') });
  if (G.r) p.set('r', G.r);
  if (G.bot) { p.set('bot', G.bot); p.set('me', mySide); }
  return '#' + p.toString();
}
const urlOf = () => location.origin + location.pathname + hashOf();
const ply = () => chess.history().length;
const ONLINE = () => !!(DB && G && !passPlay && !G.bot && !G.lesson);
const isOver = () => !!G.r || chess.isGameOver();
const recipient = () => (passPlay ? chess.turn() : other(mySide));

function games() { return store.get('wc:games', []); }
function getRec(id) { return games().find(r => r.id === id); }
function saveRec() {
  if (!G || G.lesson) return;
  const list = games().filter(r => r.id !== G.id);
  list.unshift({ id: G.id, url: urlOf(), ply: ply(), me: passPlay ? null : mySide, pp: passPlay, bot: G.bot || 0, inv: G.invited, wn: G.w.n, bn: G.b.n, over: isOver(), t: Date.now() });
  store.set('wc:games', list.slice(0, 25));
  history.replaceState(null, '', hashOf());
}

function applyUci(u) { return chess.move({ from: u.slice(0, 2), to: u.slice(2, 4), promotion: u[4] && u[4].toLowerCase() }); }

function loadFromHash() {
  closeAll();
  const g = parseHash();
  if (!g) { G = null; showSetup(); return; }
  G = { id: g.id, w: g.w, b: g.b, r: g.r, bot: g.bot };
  $('#setup').classList.remove('show');
  // keep only the legal prefix of the move list
  const test = new Chess(); const moves = [];
  for (const m of g.moves) { try { test.move({ from: m.slice(0, 2), to: m.slice(2, 4), promotion: m[4] && m[4].toLowerCase() }); moves.push(m); } catch (e) { break; } }

  const rec = getRec(G.id);
  const fresh = !rec || moves.length > rec.ply || (!!G.r && !rec.over);
  const stale = !!rec && moves.length < rec.ply;
  passPlay = !g.bot && !!(rec && rec.pp);
  G.invited = rec ? rec.inv !== false : true;   // a link you received needs no invite

  chess = new Chess();
  incoming = fresh && moves.length > 0 && !passPlay && !G.bot ? moves[moves.length - 1] : null;
  const upto = incoming ? moves.length - 1 : moves.length;
  for (let i = 0; i < upto; i++) applyUci(moves[i]);

  const turnAtEnd = moves.length % 2 === 0 ? 'w' : 'b';
  // a personal link can say which side its reader plays (&me=w or &me=b)
  const meParam = new URLSearchParams(location.hash.slice(1)).get('me');
  mySide = rec && rec.me ? rec.me : meParam === 'w' || meParam === 'b' ? meParam : turnAtEnd;
  orient = passPlay ? turnAtEnd : mySide;
  pending = false; selected = null; busy = false;
  const h = chess.history({ verbose: true }); lastMove = h[h.length - 1] || null;

  $('#stale').classList.toggle('show', stale);
  if (stale) $('#stale').innerHTML = `This is an old link. This iPad has a newer position (move ${Math.ceil(rec.ply / 2)}). <button id="latest">Open the latest</button>`;

  render();
  if (fresh && !stale && !passPlay && !G.bot) showOwl(moves.length);
  else if (!stale) saveRec();
  if (G.bot && !stale) botMove();
}

// ---------- rendering: the 3D board lives in board3d.js ----------
function kingSquare(color) {
  for (const row of chess.board()) for (const p of row) if (p && p.type === 'k' && p.color === color) return p.square;
  return null;
}
function renderSquares() {

  board3d.setHighlights({

    selected,
    targets: targets.map(m => ({ to: m.to, cap: !!m.captured })),

}

}

function captures() {
  const out = { w: [], b: [] };

}
function panelHTML(side) {

function endInfo() {
  if (G.r) return { title: `${esc(G[other(G.r)].n)} wins!`, sub: `${esc(G[G.r].n)} resigned.` };
  if (chess.isCheckmate()) return { title: `${esc(G[other(chess.turn())].n)} wins!`, sub: 'Checkmate.' };

}

// ---------- Professor Owl: a tip for the player whose turn it is ----------
const OPENINGS = [
  ['e4 e5 Nf3 Nc6 Bc4', 'the Italian Game', 'White aims a bishop at f7, the weakest square next to Black\'s king.'],
  ['e4 e5 Nf3 Nc6 Bb5', 'the Ruy Lopez', 'White pressures the knight that guards the e5 pawn. One of the oldest openings there is.'],
  ['e4 e5 Nf3 Nc6 d4', 'the Scotch Game', 'White opens the centre at once to give the pieces room.'],
  ['e4 e5 f4', 'the King\'s Gambit', 'White gives up a pawn to rush the attack. Bold and old-fashioned!'],
  ['e4 c5', 'the Sicilian Defence', 'Black fights for the centre from the side and gets an unbalanced, fighting game.'],
  ['e4 e6', 'the French Defence', 'Black builds a solid pawn wall and hits back with ...d5.'],
  ['e4 c6', 'the Caro-Kann', 'A sturdy defence: Black prepares ...d5 without blocking the light-squared bishop.'],
  ['d4 d5 c4', 'the Queen\'s Gambit', 'White offers a pawn to win control of the centre.'],
  ['d4 Nf6 c4 g6', 'the King\'s Indian', 'Black lets White take the centre, then attacks it later.'],
  ['e4 e5', 'an Open Game', 'Both sides put a pawn in the centre. Bring out your knights next.'],
  ['d4 d5', 'a Closed Game', 'Pawns face each other in the centre: the game will be slower and more strategic.'],
];
const colourName = c => (c === 'w' ? 'White' : 'Black');
function coachTip() {
  const me = chess.turn(), them = other(me);
  const hist = chess.history();
  const ply = hist.length;
  const pieces = chess.board().flat().filter(Boolean);
  const big = pieces.filter(p => p.type !== 'k' && p.type !== 'p');
  const phase = ply < 16 ? 'Opening' : (big.length <= 6 || (!pieces.some(p => p.type === 'q') && big.length <= 8)) ? 'Endgame' : 'Middlegame';
  const S = sq => sq.toUpperCase();
  const nm = t => NAMES[t].toLowerCase();
  if (chess.inCheck()) return [phase, 'Check!', 'Your king is attacked. Three ways out: move the king, block the attack, or capture the attacker.', [kingSquare(me)], 'o-tip-check'];
  // checkmate in one?
  for (const m of chess.moves({ verbose: true })) {
    chess.move(m); const mate = chess.isCheckmate(); chess.undo();
    if (mate) return [phase, 'Checkmate in one!', `There is a move that wins the game right now. Look closely at your ${nm(m.piece)}...`, [m.from], 'o-tip-mate1'];
  }
  // a piece to win, or a piece in danger
  let free = null, risk = null;
  for (const p of pieces) {
    if (p.type === 'k') continue;
    if (p.color === them && chess.isAttacked(p.square, me)) {
      const cheap = chess.attackers(p.square, me).some(a => VALUE[chess.get(a).type] < VALUE[p.type]);
      if ((!chess.isAttacked(p.square, them) || cheap) && (!free || VALUE[p.type] > VALUE[free.type])) free = p;
    }
    if (p.color === me && chess.isAttacked(p.square, them)) {
      const cheap = chess.attackers(p.square, them).some(a => VALUE[chess.get(a).type] < VALUE[p.type]);
      if ((!chess.isAttacked(p.square, me) || cheap) && (!risk || VALUE[p.type] > VALUE[risk.type])) risk = p;
    }
  }
  if (risk && (!free || VALUE[risk.type] >= VALUE[free.type])) return [phase, 'Watch out!', `Your ${nm(risk.type)} on ${S(risk.square)} can be taken. Move it, or protect it with another piece.`, [risk.square], `o-tip-risk-${risk.type}`];
  if (free) return [phase, 'A piece to win!', `${colourName(them)}'s ${nm(free.type)} on ${S(free.square)} is not safe. Can you capture it?`, [free.square], `o-tip-free-${free.type}`];
  // guard f7 / f2 against the Scholar's Mate
  const weak = me === 'w' ? 'f2' : 'f7';
  if (ply < 12 && chess.attackers(weak, them).length >= 2) return [phase, `Guard ${S(weak)}!`, `Two enemy pieces are aiming at ${S(weak)}, next to your king. Defend it, or you could be checkmated quickly.`, [weak], 'o-tip-guard'];
  if (phase === 'Opening') {
    const line = hist.join(' ');
    const op = OPENINGS.find(o => (line + ' ').startsWith(o[0] + ' ') || line === o[0]);
    if (op && ply <= op[0].split(' ').length + 3) return [phase, `This is ${op[1]}`, op[2], [], `o-tip-op-${OPENINGS.indexOf(op)}`];
    const home = me === 'w' ? '1' : '8';
    const knightsHome = pieces.filter(p => p.color === me && p.type === 'n' && p.square[1] === home).length;
    const kingHome = kingSquare(me) === 'e' + home;
    const queenOut = !pieces.some(p => p.color === me && p.type === 'q' && p.square === 'd' + home);
    const centre = pieces.some(p => p.color === me && p.type === 'p' && ['d4', 'e4', 'd5', 'e5'].includes(p.square));
    if (!centre) return [phase, 'Take the centre', 'Pawns on e4 and d4 (or e5 and d5) control the middle of the board and give your pieces room.', ['d4', 'e4', 'd5', 'e5'], 'o-tip-centre'];
    if (queenOut && ply < 10) return [phase, 'Careful with the queen', 'Bringing her out early lets your opponent chase her around while they develop. Knights and bishops first.', pieces.filter(p => p.color === me && p.type === 'q').map(p => p.square), 'o-tip-queen'];
    if (knightsHome >= 1) return [phase, 'Knights before bishops', 'Bring your knights out towards the centre: c3 and f3 for White, c6 and f6 for Black.', me === 'w' ? ['c3', 'f3'] : ['c6', 'f6'], 'o-tip-knights'];
    if (kingHome && ply >= 8) return [phase, 'Castle soon', 'Castling tucks your king into the corner and brings a rook into the game. Clear the pieces between them first.', [kingSquare(me), me === 'w' ? 'g1' : 'g8'], 'o-tip-castle'];
    return [phase, 'Opening rules', 'Control the centre, develop your knights and bishops, castle, then connect your rooks.', [], 'o-tip-rules'];
  }
  if (phase === 'Middlegame') {
    const tips = [
      ['Make a plan', 'Attack where you have more pieces. Count attackers and defenders before you capture.'],
      ['Look for forks', 'A knight or queen that attacks two pieces at once usually wins one of them.'],
      ['Rooks love open files', 'Put your rooks on lines with no pawns, so they can reach the other side.'],
      ['Ask "what do they want?"', 'Before every move, check what your opponent\'s last move threatens.'],
      ['Pins and skewers', 'A piece stuck in front of its king or queen is pinned: attack it again!'],
      ['Trade when ahead', 'If you have more pieces, swapping pieces makes your advantage easier to use.'],
    ];
    const i = Math.floor(ply / 2) % tips.length, t = tips[i];
    return [phase, t[0], t[1], [], `o-tip-mid-${i}`];
  }
  const tips = [
    ['King, come out!', 'In the endgame the king is a strong piece. March it towards the centre and the pawns.'],
    ['Push passed pawns', 'A pawn with no enemy pawns in front of it can run to the far side and become a queen.'],
    ['Rook behind the pawn', 'Rooks belong behind passed pawns, yours or your opponent\'s.'],
    ['The opposition', 'With only kings and pawns, standing your king face to face with theirs (one square apart) can win the race.'],
  ];
  const i = Math.floor(ply / 2) % tips.length, t = tips[i];
  return [phase, t[0], t[1], [kingSquare(me)].filter(() => i === 0), `o-tip-end-${i}`];
}
let coachMemo = { key: '', tip: null };
function coachTipCached() {
  const k = chess.fen();
  if (k !== coachMemo.key) coachMemo = { key: k, tip: coachTip() };
  return coachMemo.tip;
}
const coachVisible = () => prefs.coach && G && !LESSON && !isOver() && !busy && !pending && !incoming && (passPlay || chess.turn() === mySide);
function hintSquares() {
  if (LESSON) return LESSON.hintOn && !LESSON.done ? LESSON.l.hintSq : [];
  const sg = sugNow();
  if (sg && sg.from && sugVisible()) return [sg.from, sg.to];
  if (!coachVisible() || selected) return [];
  return (coachTipCached()[3] || []).filter(Boolean);
}
function coachHTML() {
  if (!coachVisible() || sugNow()) return '';
  const [phase, title, text] = coachTipCached();
  return `<div class="coach" data-act="owlsay" style="cursor:pointer"><span class="ph">${phase} 🔊</span><b>🦉 Professor Owl: ${esc(title)}</b>${esc(text)}</div>`;
}

// ---------- 💡 suggest a move: Stockfish (engine/, a Web Worker) finds it, Professor Owl explains it ----------
let sfReady = null, SUG = null;            // SUG: { fen, thinking } | { fen, fail } | { fen, from, to, title, text, key }
function engine() {
  if (sfReady) return sfReady;
  sfReady = new Promise((res, rej) => {
    let w; try { w = new Worker('engine/stockfish.js'); } catch (e) { rej(e); return; }
    w.onmessage = e => { if (String(e.data).trim() === 'uciok') res(w); };
    w.onerror = rej;
    w.postMessage('uci');
    setTimeout(() => rej(new Error('engine did not start')), 20000);
  });
  sfReady.catch(() => { sfReady = null; });
  return sfReady;
}
async function bestMove(fen, ms = 1500, skill = 20) {
  const w = await engine();
  return new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error('no move')), ms + 10000);
    w.onmessage = e => { const m = /^bestmove (\S+)/.exec(String(e.data)); if (m) { clearTimeout(t); res(m[1]); } };
    w.postMessage('ucinewgame'); w.postMessage('setoption name Skill Level value ' + skill); w.postMessage('position fen ' + fen); w.postMessage('go movetime ' + ms);
  });
}
// a piece is in danger if the other side attacks it and it is unguarded, or a cheaper piece attacks it
function inDanger(sq) {
  const p = chess.get(sq); if (!p || p.type === 'k') return false;
  const o = other(p.color);
  if (!chess.isAttacked(sq, o)) return false;
  return !chess.isAttacked(sq, p.color) || chess.attackers(sq, o).some(a => VALUE[chess.get(a).type] < VALUE[p.type]);
}
const SG = {
  mate: 'Checkmate! This move wins the game.',
  promo: 'Your pawn reaches the far side and becomes a queen!',
  check: 'Check! The enemy king has to run, hide, or be rescued.',
  castle: 'Castle! Your king hides safely in the corner, and a rook joins the game.',
  trade: 'A fair swap: you take one of theirs, even if they take one back.',
  dev: 'This brings a new piece into the game. Get them all out early!',
  centre: 'A pawn in the centre gives your pieces room to move.',
  quiet: 'A quiet move that makes your position stronger. Can you work out why?',
};
const nmL = t => NAMES[t].toLowerCase();
for (const p of 'pnbrqk') SG[`fork-${p}`] = `A fork! Your ${nmL(p)} attacks two pieces at once, and they can only save one.`;
for (const p of 'pnbrq') {
  SG[`free-${p}`] = `Take the ${nmL(p)}! Nobody is guarding it, so it's free.`;
  SG[`win-${p}`] = `Take the ${nmL(p)}! It's worth more than the piece you take it with.`;
  SG[`save-${p}`] = `Your ${nmL(p)} was in danger. This moves it somewhere safe.`;
  SG[`guard-${p}`] = `Your ${nmL(p)} was in danger. This move protects it.`;
  SG[`attack-${p}`] = `This attacks their ${nmL(p)}. Now they have to deal with that!`;
}
function explainMove(uci) {
  const me = chess.turn(), them = other(me);
  const before = chess.board().flat().filter(p => p && p.color === me && p.type !== 'k' && inDanger(p.square)).map(p => p.square);
  const m = chess.move({ from: uci.slice(0, 2), to: uci.slice(2, 4), promotion: uci[4] || 'q' });
  if (!m) return null;
  const t = m.promotion || m.piece;
  const safe = !inDanger(m.to);
  const mate = chess.isCheckmate(), check = chess.inCheck();
  const hit = chess.board().flat().filter(p => p && p.color === them && (p.type === 'k' || VALUE[p.type] >= 3) && chess.attackers(p.square, me).includes(m.to));
  const stillDanger = before.filter(sq => sq !== m.from && chess.get(sq) && chess.get(sq).color === me && inDanger(sq));
  const guarded = before.filter(sq => sq !== m.from && !stillDanger.includes(sq));
  const lone = hit.filter(p => p.type !== 'k' && VALUE[p.type] > VALUE[t] || p.type !== 'k' && !chess.isAttacked(p.square, them));
  chess.undo();
  const ply = chess.history().length, home = me === 'w' ? '1' : '8';
  let key;
  if (mate) key = 'mate';
  else if (m.promotion) key = 'promo';
  else if (safe && hit.length >= 2) key = `fork-${m.piece}`;
  else if (m.captured && safe) key = `free-${m.captured}`;
  else if (m.captured && VALUE[m.captured] > VALUE[m.piece]) key = `win-${m.captured}`;
  else if (/[kq]/.test(m.flags)) key = 'castle';
  else if (before.includes(m.from) && safe) key = `save-${m.piece}`;
  else if (guarded.length) key = `guard-${chess.get(guarded[0]).type}`;
  else if (m.captured) key = 'trade';
  else if (check) key = 'check';
  else if (safe && lone.length) key = `attack-${lone[0].type}`;
  else if (ply < 20 && 'nb'.includes(m.piece) && m.from[1] === home) key = 'dev';
  else if (m.piece === 'p' && ['d4', 'e4', 'd5', 'e5', 'c4', 'c5'].includes(m.to)) key = 'centre';
  else key = 'quiet';
  const move = /[kq]/.test(m.flags) ? 'Castle' : `${NAMES[m.piece]} to ${m.to.toUpperCase()}`;
  return { title: `Try: ${move}`, text: SG[key], key: 'o-sg-' + key };
}
const sugVisible = () => G && !LESSON && !isOver() && !busy && !pending && !incoming && (passPlay || chess.turn() === mySide);
const sugNow = () => SUG && G && SUG.fen === chess.fen() ? SUG : null;
async function suggest() {
  const fen = chess.fen();
  if (sugNow() && !sugNow().fail) return;
  SUG = { fen, thinking: true }; selected = null; render();
  sfx('owl');
  let uci = null;
  try { uci = await bestMove(fen); } catch (e) { console.warn('[suggest]', e); }
  if (!G || chess.fen() !== fen) return;    // a move was made while the owl was thinking
  const ex = uci && uci !== '(none)' ? explainMove(uci) : null;
  SUG = ex ? { fen, from: uci.slice(0, 2), to: uci.slice(2, 4), ...ex } : { fen, fail: true };
  render();
  if (ex) voice([ex.key], ex.text);

// ---------- 🤖 the computer opponent ----------
// Owlet and Pixie are home-made and beatable; Wizard and Dragon are Stockfish at low and full strength.
const BOTS = { 1: { name: '🐣 Owlet' }, 2: { name: '🧚 Pixie' }, 3: { name: '🧙 Wizard', ms: 400, skill: 3 }, 4: { name: '🐉 Dragon', ms: 1500, skill: 20 } };
const uciOf = m => m.from + m.to + (m.promotion || '');
const anyOf = a => a[Math.floor(Math.random() * a.length)];
let botGen = 0;
async function pickBotMove(lv) {
  const b = BOTS[lv];
  if (b.skill != null) { try { return await bestMove(chess.fen(), b.ms, b.skill); } catch (e) { console.warn('[bot]', e); } }
  const moves = chess.moves({ verbose: true });
  if (lv === 1) {    // Owlet: random, but grabs a capture now and then
    const caps = moves.filter(m => m.captured);
    return uciOf(caps.length && Math.random() < 0.4 ? anyOf(caps) : anyOf(moves));
  }
  // Pixie: looks one move ahead. Takes things, saves pieces, avoids hanging them; sometimes daydreams
  if (Math.random() < 0.2) return uciOf(anyOf(moves));
  const me = chess.turn();
  const danger = new Set(chess.board().flat().filter(p => p && p.color === me && inDanger(p.square)).map(p => p.square));
  let best = null, bestS = -1e9;
  for (const m of moves) {
    chess.move(m);
    let sc = Math.random() * 4;
    if (chess.isCheckmate()) sc += 1000;
    if (m.captured) sc += VALUE[m.captured] * 10;
    if (m.promotion) sc += 80;
    if (inDanger(m.to)) sc -= VALUE[m.promotion || m.piece] * 10;
    if (danger.has(m.from)) sc += VALUE[m.piece] * 8;
    if (chess.inCheck()) sc += 2;
    if ('cdef'.includes(m.to[0]) && '3456'.includes(m.to[1])) sc += 2;                  // likes the centre
    if ('nb'.includes(m.piece) && (m.from[1] === '1' || m.from[1] === '8')) sc += 2;   // brings pieces out
    chess.undo();
    if (sc > bestS) { bestS = sc; best = m; }
  }
  return uciOf(best);
}
async function botMove() {
  if (!G || !G.bot || isOver() || busy || chess.turn() === mySide) return;
  const id = ++botGen, fen = chess.fen(), t0 = Date.now();
  renderPanels();
  const uci = await pickBotMove(G.bot);
  await sleep(Math.max(0, 1100 - (Date.now() - t0)));     // a little thinking time, so it doesn't feel instant
  if (!G || id !== botGen || chess.fen() !== fen || !uci) return;
  await doMove(uci, true);
}
function sugHTML() {
  if (!sugVisible()) return '';

  if (!s) return `<button class="btn ghost" data-act="suggest">💡 Suggest a move</button>`;
  if (s.thinking) return `<div class="coach"><b>🦉 Professor Owl is thinking…</b>Hmm, let me look at the whole board.</div>`;
  if (s.fail) return `<div class="coach"><b>🦉 Professor Owl is puzzled</b>I couldn't work it out just now.</div><button class="btn ghost" data-act="suggest">💡 Try again</button>`;
  return `<div class="coach" data-act="sugsay" style="cursor:pointer"><span class="ph">🔊</span><b>💡 ${esc(s.title)}</b>${esc(s.text)}</div>`;
}

const canMove = () => G && !(LESSON && LESSON.done) && !busy && !isOver() && !pending && !incoming && (passPlay || chess.turn() === mySide);

async function handleTap(sq) {
  if (!canMove()) return;
  const piece = chess.get(sq);
  if (selected) {
    const mv = chess.moves({ square: selected, verbose: true }).filter(m => m.to === sq);
    if (mv.length) {
      let promo = '';
      if (mv[0].promotion) { promo = await askPromotion(chess.turn()); if (!promo) return; }
      const from = selected; selected = null;
      if (LESSON) await lessonMove(from + sq + promo);
      else await doMove(from + sq + promo.toUpperCase(), false);
      return;
    }
  }
  if (piece && piece.color === chess.turn()) { selected = sq === selected ? null : sq; sfx('select'); }
  else selected = null;
  renderSquares();
}

async function doMove(uci, remote) {
  let mv;
  try { mv = applyUci(uci); } catch (e) { return; }
  busy = true; selected = null; lastMove = mv;
  renderSquares();
  await animate(mv);
  busy = false;
  if (remote) incoming = null;
  else if (!passPlay && !G.bot) {
    if (DB) { if (await dbPut()) toast('🦉 Move sent!'); else pending = true; }   // no extra Send tap
    else pending = true;
  }
  render();
  if (chess.isCheckmate()) toppleKing();
  commentate(mv);
  saveRec();
  if (passPlay && !remote && !isOver()) { await sleep(900); orient = chess.turn(); render(); }
  if (remoteQueue) { const q = remoteQueue; remoteQueue = null; onRemote(q); }
  if (G.bot && !remote) botMove();
}

const BANTER = ['Blimey, that was brutal!', "Ooh, that's gotta hurt!", 'Smashed to bits!', 'Wicked!', 'No mercy!', 'Bet that stung!'];
function commentate(mv) {
  let keys;
  if (mv.isKingsideCastle() || mv.isQueensideCastle()) keys = ['r-castle'];
  else if (mv.captured) keys = [`r-cap-${mv.piece}-${mv.captured}`];
  else keys = [`r-mv-${mv.piece}-${mv.to}`];
  if (mv.promotion) keys.push(`r-promo-${mv.promotion}`);
  if (chess.isCheckmate()) keys.push('r-mate');
  else if (chess.isDraw()) keys.push('r-draw');
  else if (chess.inCheck()) keys.push('r-check');
  else if (mv.captured && Math.random() < 0.6) keys.push(`r-ban-${Math.floor(Math.random() * BANTER.length)}`);
  voice(keys, callout(mv));
}
function callout(mv) {
  const to = mv.to.toUpperCase();
  let s;
  if (mv.isKingsideCastle() || mv.isQueensideCastle()) s = 'Castle!';
  else if (mv.captured) s = `${NAMES[mv.piece]} takes ${NAMES[mv.captured].toLowerCase()}, ${to}!`;
  else s = `${NAMES[mv.piece]} to ${to}.`;
  if (mv.promotion) s += ` It becomes a ${NAMES[mv.promotion].toLowerCase()}!`;
  if (chess.isCheckmate()) s += ' Checkmate!';
  else if (chess.inCheck()) s += ' Check!';
  return s;
}

async function animate(mv) {

async function lessonMove(uci) {
  const L = LESSON.l, before = chess.fen();
  let mv;
  try { mv = applyUci(uci); } catch (e) { return; }
  busy = true; lastMove = mv; renderSquares();
  await animate(mv);
  busy = false;
  const u = (mv.from + mv.to + (mv.promotion || '')).toLowerCase();
  const ok = L.goal === 'mate' ? chess.isCheckmate()
    : u === L.solution[LESSON.step] || (LESSON.step === 0 && (L.accept || []).includes(u));
  if (!ok) {
    LESSON.msg = ['Not quite', L.hint]; LESSON.hintOn = true;
    render(); voice(['o-les-wrong', `o-les-${L.id}-hint`], 'Not quite. Try again.');
    await sleep(1500);
    chess = new Chess(before); lastMove = null; render();
    return;
  }
  LESSON.step++;
  if (L.goal !== 'mate' && LESSON.step < L.solution.length) {
    LESSON.msg = ['Good!', L.mid || 'Now watch my reply...']; LESSON.hintOn = false;
    render(); voice([`o-les-${L.id}-mid`], '');
    await sleep(900);
    const rm = applyUci(L.solution[LESSON.step]);
    busy = true; lastMove = rm; renderSquares();
    await animate(rm);
    busy = false; LESSON.step++;
    render();
    if (LESSON.step < L.solution.length) return;
  }
  LESSON.done = true; LESSON.hintOn = false;
  LESSON.msg = ['Well done!', L.done];

  menuHouses(); saveRec(); render();
  if (ONLINE()) dbPut();
});
function menuLabels() {
  $('#piecesBtn').textContent = prefs.pieces === 'heroes' ? '♞ Pieces: animated heroes (tap for classic)' : '♞ Pieces: classic (tap for heroes)';
  $('#ppBtn').textContent = passPlay ? 'Play by owl post instead' : 'Both players on this iPad';

  $('#resignBtn').style.display = isOver() ? 'none' : '';
}
function closeAll() { for (const id of ['menu', 'log', 'promo', 'lessonsOv']) $('#' + id).classList.remove('show'); if (G) $('#setup').classList.remove('show'); }
function showMoves() {
  const h = chess.history();

  for (let i = 0; i < h.length; i += 2) out += `<div><b>${i / 2 + 1}.</b>${esc(h[i])} ${esc(h[i + 1] || '')}</div>`;
  $('#moves').innerHTML = out || '<div class="sub">No moves yet.</div>';
}

// ---------- new game screen ----------
const pick = { myHouse: prefs.house, oppHouse: prefs.oppHouse, mySide: 'w', vs: 'friend', botLevel: '1' };
function houseButtons(id) {
  $('#' + id).innerHTML = Object.entries(HOUSES).map(([k, h]) =>
    `<button class="choice ${pick[id] === k ? 'on' : ''}" data-v="${k}" style="--c1:${h.c1};--c2:${h.c2}"><span class="sw"></span>${h.name.slice(0, 10)}</button>`).join('');
}
for (const id of ['myHouse', 'oppHouse', 'mySide', 'vs', 'botLevel']) {

function vsLabels() {

}
function showSetup() {
  $('#myName').value = prefs.name || '';
  houseButtons('myHouse'); houseButtons('oppHouse');
  const list = games();
  $('#games').innerHTML = list.length ? '<h2>Your games</h2>' + list.map(r => {
    const turn = r.ply % 2 === 0 ? 'w' : 'b';

    return `<button class="game" data-url="${esc(r.url)}"><span>${esc(r.wn)} v ${esc(r.bn)}</span><small>move ${Math.floor(r.ply / 2) + 1} · ${state}</small></button>`;
  }).join('') : '';
  $('#joinBox').style.display = DB ? '' : 'none';
  $('#joinWho').innerHTML = '';
  $('#setup').classList.add('show');
  $('#stale').classList.remove('show');
}
$('#joinBtn').addEventListener('click', async () => {
  const code = $('#joinCode').value.trim().toUpperCase();
  $('#joinWho').innerHTML = '';
  if (!code) return;
  const d = await dbGet(code);
  if (!d || !d.w || !d.b) { toast('No game with that code.'); return; }
  $('#joinWho').innerHTML = ['w', 'b'].map(s => `<button class="btn" data-side="${s}">I'm ${esc(d[s].n)}</button>`).join('');
  $('#joinWho').onclick = e => {

    store.set('wc:games', list.slice(0, 25));
    const p = new URLSearchParams({ id: code, wn: d.w.n, wh: d.w.h, bn: d.b.n, bh: d.b.h, m: d.m || '' });

$('#games').addEventListener('click', e => { const b = e.target.closest('.game'); if (b) location.href = b.dataset.url; });
$('#beginBtn').addEventListener('click', () => {
  unlockAudio(true);
  const myName = $('#myName').value.trim().slice(0, 20) || 'Wizard';
  const bot = pick.vs === 'bot' ? +pick.botLevel : 0;
  const oppName = bot ? BOTS[bot].name : $('#oppName').value.trim().slice(0, 20) || 'Friend';
  prefs.name = myName; prefs.house = pick.myHouse; prefs.oppHouse = pick.oppHouse; savePrefs();
  const me = { n: myName, h: pick.myHouse }, op = { n: oppName, h: pick.oppHouse };
  const id = bot ? 'PC' + newCode() : newCode();

  if (bot) { G.bot = bot; G.invited = true; }
  if (!bot) G.invited = false;
  chess = new Chess();

  mySide = pick.mySide; orient = passPlay ? 'w' : mySide;

});

// ---------- sound: synthesised, no files ----------
let AC = null, NOISE = null, spoke = false;
function unlockAudio(withSpeech) {
  audioOn = true;
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
  if (AC.state !== 'running') AC.resume();   // iOS starts suspended, and calls (FaceTime) leave it 'interrupted'
  if (!NOISE) {
    NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  // iOS only lets speech start from a tap: prime it with a silent utterance
  if ((withSpeech || !spoke) && 'speechSynthesis' in window) {
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); spoke = true; } catch (e) {}
  }
}
function env(g, t, peak, dur, attack = 0.008) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
function noise(t, dur, type, freq, peak, q = 1) {
  const s = AC.createBufferSource(); s.buffer = NOISE;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); env(g, t, peak, dur);
  s.connect(f).connect(g).connect(AC.destination);
  s.start(t, Math.random()); s.stop(t + dur + 0.05);
}
function tone(t, f0, f1, dur, peak, type = 'sine', attack) {
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain(); env(g, t, peak, dur, attack);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.05);
}
// Recorded sounds and voices live in sounds/ (listed in sounds/manifest.json).
// Anything not recorded falls back to the synthesised sound or the iPad voice.
let CLIPS = new Set(); const BUF = new Map();
fetch('sounds/manifest.json', { cache: 'no-store' }).then(r => (r.ok ? r.json() : [])).then(k => { CLIPS = new Set(k); }).catch(() => {});
function clipBuf(key) {
  if (!BUF.has(key)) BUF.set(key, fetch(`sounds/${key}.mp3`).then(r => r.arrayBuffer())
    .then(b => new Promise((res, rej) => AC.decodeAudioData(b, res, rej))).catch(() => null));
  return BUF.get(key);
}
function playClip(key, vol = 0.8, when = 0) {
  if (!AC || !CLIPS.has(key)) return false;
  clipBuf(key).then(b => {
    if (!b) return;
    const s = AC.createBufferSource(), g = AC.createGain(); g.gain.value = vol;
    s.buffer = b; s.connect(g).connect(AC.destination); s.start(AC.currentTime + when);
  });
  return true;
}
let voiceGen = 0;
async function voice(keys, text) {
  if (!prefs.voice) return;
  if (!AC) unlockAudio();
  if (!keys.length || !keys.every(k => CLIPS.has(k))) { if (text) speak(text); return; }
  const id = ++voiceGen; try { speechSynthesis.cancel(); } catch (e) {}
  const bufs = await Promise.all(keys.map(clipBuf));
  if (id !== voiceGen) return;
  if (bufs.some(b => !b)) { if (text) speak(text); return; }
  let t = AC.currentTime + 0.05;
  for (const b of bufs) { const s = AC.createBufferSource(), g = AC.createGain(); g.gain.value = 1; s.buffer = b; s.connect(g).connect(AC.destination); s.start(t); t += b.duration + 0.06; }
}
const SFX_CLIP = { piece: a => 'move-' + a, strike: () => 'slash', crash: () => 'shatter', check: () => 'check', gong: () => 'checkmate',
  chime: () => 'promote', battlecry: () => 'battlecry', fireball: () => 'fireball', arrow: () => 'arrow', beam: () => 'beam', firework: () => 'firework', castle: () => 'castle', owl: () => 'owl', start: () => 'start' };
const SFX_VOL = { 'move-p': 0.5, 'move-b': 0.6, 'move-n': 0.7, checkmate: 0.9, battlecry: 0.7, owl: 0.6 };

function sfx(name, arg) {
  if (!prefs.sound || !AC || !NOISE) return;
  const ck = SFX_CLIP[name] && SFX_CLIP[name](arg);
  if (ck && playClip(ck, SFX_VOL[ck] || 0.8)) return;
  if (name === 'slide' && CLIPS.has('move-p')) return;     // each piece has its own sound now
  const t = AC.currentTime + 0.01;
  switch (name) {
    case 'select': tone(t, 540, 540, 0.09, 0.05, 'triangle'); break;
    case 'slide': noise(t, arg, 'bandpass', 650, 0.14, 0.7); tone(t, 95, 60, 0.2, 0.18); tone(t + arg - 0.05, 120, 50, 0.18, 0.22); break;
    case 'crash':
      noise(t, 0.7, 'lowpass', 1600, 0.8); tone(t, 85, 30, 0.6, 0.7);
      for (let i = 0; i < 9; i++) noise(t + 0.05 + Math.random() * 0.55, 0.05 + Math.random() * 0.05, 'highpass', 2200 + Math.random() * 2500, 0.18);
      break;
    case 'check': tone(t, 110, 110, 1.0, 0.16, 'sine', 0.05); tone(t, 116.5, 116.5, 1.0, 0.16, 'sine', 0.05); tone(t, 233, 233, 0.8, 0.05, 'triangle', 0.05); break;
    case 'gong': [98, 196, 294, 392, 523].forEach((f, i) => tone(t, f, f * 0.993, 3.5 - i * 0.5, 0.22 / (i + 1), 'sine', 0.01)); noise(t, 0.3, 'bandpass', 900, 0.1); break;
    case 'strike': noise(t, 0.16, 'highpass', 1800, 0.25); tone(t, 900, 300, 0.12, 0.08, 'sawtooth'); break;
    case 'thud': tone(t, 70, 40, 0.4, 0.5); noise(t, 0.25, 'lowpass', 600, 0.3); break;
    case 'chime': [784, 988, 1175, 1568].forEach((f, i) => tone(t + i * 0.09, f, f, 0.6, 0.08)); break;
  }
}
function speak(text) {
  if (!prefs.voice || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = speechSynthesis.getVoices().find(v => /en[-_]GB/i.test(v.lang));
    if (v) u.voice = v;
    u.lang = 'en-GB'; u.rate = 0.95;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// after a phone or FaceTime call, the next tap brings the sound back
document.addEventListener('pointerdown', () => { if (AC && AC.state !== 'running') AC.resume(); }, true);

window.__wcLines = () => {
  const L = {}, SQS = [];
  for (const f of 'abcdefgh') for (let r = 1; r <= 8; r++) SQS.push(f + r);
  for (const p of 'pnbrqk') for (const sq of SQS) { if (p === 'p' && (sq[1] === '1' || sq[1] === '8')) continue; L[`r-mv-${p}-${sq}`] = `${NAMES[p]} to ${sq.toUpperCase()}!`; }
  for (const p of 'pnbrqk') for (const c of 'pnbrq') L[`r-cap-${p}-${c}`] = `${NAMES[p]} takes ${NAMES[c].toLowerCase()}!`;
  L['r-castle'] = "Castles! The king's tucked away, nice and safe.";
  for (const p of 'qrbn') L[`r-promo-${p}`] = `The pawn's turned into a ${NAMES[p].toLowerCase()}! Brilliant!`;
  L['r-check'] = "Check! The king's in trouble!";
  L['r-mate'] = 'Checkmate! What a game!';
  L['r-draw'] = "It's a draw! Nobody wins this one.";
  BANTER.forEach((b, i) => { L[`r-ban-${i}`] = b; });
  L['r-start'] = "Right then, let's play some wizard chess!";
  // Professor Owl
  L['o-tip-check'] = 'Check! Your king is under attack. Move it, block the attack, or capture the attacker.';
  L['o-tip-mate1'] = "Oh! There's a move that wins the game right now. Look very carefully.";
  for (const p of 'pnbrq') {
    L[`o-tip-risk-${p}`] = `Watch out! Your ${NAMES[p].toLowerCase()} on the purple square can be taken. Move it, or protect it.`;
    L[`o-tip-free-${p}`] = `A piece to win! That ${NAMES[p].toLowerCase()} on the purple square isn't safe. Can you capture it?`;
  }
  L['o-tip-guard'] = 'Careful! Two enemy pieces are aiming at the square next to your king. Defend it!';
  OPENINGS.forEach((o, i) => { L[`o-tip-op-${i}`] = `This is ${o[1]}. ${o[2]}`; });
  L['o-tip-centre'] = 'Take the centre! Pawns in the middle of the board give your pieces room to move.';
  L['o-tip-queen'] = "Careful with the queen. If she comes out too early, she'll be chased around. Knights and bishops first.";
  L['o-tip-knights'] = 'Knights before bishops. Bring your knights out towards the centre.';
  L['o-tip-castle'] = 'Castle soon! It tucks your king into the corner and brings a rook into the game.';
  L['o-tip-rules'] = 'Remember the opening rules: control the centre, develop your knights and bishops, castle, then connect your rooks.';
  const mid = ['Make a plan. Attack where you have more pieces, and count attackers and defenders before you capture.',
    'Look for forks. A knight or queen that attacks two pieces at once usually wins one of them.',
    'Rooks love open files. Put them on lines with no pawns, so they can reach the other side.',
    "Before every move, ask yourself: what does my opponent want? Check what their last move threatens.",
    'Pins and skewers! A piece stuck in front of its king or queen is pinned. Attack it again!',
    "Trade when you're ahead. Swapping pieces makes your advantage easier to use."];
  mid.forEach((t, i) => { L[`o-tip-mid-${i}`] = t; });
  const end = ['King, come out! In the endgame the king is a strong piece. March it towards the centre.',
    "Push your passed pawns. A pawn with nothing in its way can run to the far side and become a queen.",
    "Rooks belong behind passed pawns, yours or your opponent's.",
    'The opposition: with only kings and pawns, standing your king face to face with theirs can win the race.'];
  end.forEach((t, i) => { L[`o-tip-end-${i}`] = t; });
  for (const [k, t] of Object.entries(SG)) L['o-sg-' + k] = t;
  L['o-les-wrong'] = 'Not quite. Have another look.';
  for (const l of LESSONS) {
    L[`o-les-${l.id}-intro`] = l.intro; L[`o-les-${l.id}-hint`] = l.hint; L[`o-les-${l.id}-done`] = l.done;
    if (l.mid) L[`o-les-${l.id}-mid`] = l.mid;
  }
  return L;
};

// ---------- layout ----------
function layout() {
  const W = innerWidth, H = innerHeight;
  const wide = W > H * 1.15 && W >= 700;
  document.body.classList.toggle('wide', wide);
  let s = wide ? Math.min(H - 100, W - 380) : Math.min(W - 56, H - 320);
  s = Math.max(232, Math.floor(s / 8) * 8);
  document.documentElement.style.setProperty('--bs', s + 'px');
  requestAnimationFrame(() => board3d.resize());
}
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 250));
addEventListener('hashchange', boot);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (AC && AC.state !== 'running') AC.resume();
  refresh();   // iOS pauses the live connection in the background
});

// ---------- live sync: Firebase Realtime Database over REST (optional) ----------
const DB = ((window.WC_CONFIG && window.WC_CONFIG.databaseURL) || '').replace(/\/$/, '');
let es = null, remoteQueue = null, audioOn = false;
const dbUrl = id => `${DB}/games/${encodeURIComponent(id)}.json`;
async function dbGet(id) {
  try { const r = await fetch(dbUrl(id), { cache: 'no-store' }); return r.ok ? await r.json() : null; } catch (e) { return null; }
}
async function dbPut() {
  if (G && G.lesson) return true;
  try {
    const r = await fetch(dbUrl(G.id), { method: 'PUT', body: JSON.stringify({ w: G.w, b: G.b, m: uciList().join(''), r: G.r || '', t: Date.now() }) });
    return r.ok;
  } catch (e) { return false; }
}
const remoteMoves = d => (d && typeof d.m === 'string' && d.m.match(MOVE_RE)) || [];
const samePrefix = (a, b) => { for (let i = 0; i < Math.min(a.length, b.length); i++) if (a[i] !== b[i]) return false; return true; };

function watch() {
  if (es) { es.close(); es = null; }
  if (!ONLINE() || !window.EventSource) return;
  es = new EventSource(dbUrl(G.id));
  es.addEventListener('put', e => {
    try {
      const { path, data } = JSON.parse(e.data);
      if (path !== '/') refresh();
      else if (data) onRemote(data);
      else if (G.invited || ply() > 0) dbPut();   // no record yet: create it
    } catch (_) {}
  });
  es.addEventListener('patch', refresh);
}
setInterval(() => { if (ONLINE() && !document.hidden && !busy) refresh(); }, 4000);
addEventListener('pageshow', () => refresh());
addEventListener('focus', () => refresh());
async function refresh() {
  if (!ONLINE()) return;
  const d = await dbGet(G.id);
  if (d) onRemote(d);
}
async function onRemote(d) {
  if (!G || passPlay) return;
  if (busy || incoming || $('#promo').classList.contains('show')) { remoteQueue = d; return; }
  const rm = remoteMoves(d), lm = uciList();
  if (!samePrefix(rm, lm)) return;                       // games disagree: keep ours
  if (rm.length < lm.length) { if (!pending) dbPut(); return; }   // our earlier send failed: retry
  if (d.w && d.b && (d.w.h !== G.w.h || d.b.h !== G.b.h)) { G.w.h = HOUSES[d.w.h] ? d.w.h : G.w.h; G.b.h = HOUSES[d.b.h] ? d.b.h : G.b.h; saveRec(); renderPanels(); }
  if (rm.length === lm.length) {
    if (d.r && !G.r) { G.r = d.r; saveRec(); render(); sfx('gong'); }
    return;
  }
  if (pending) return;
  for (let i = lm.length; i < rm.length - 1; i++) applyUci(rm[i]);
  if (d.r === 'w' || d.r === 'b') G.r = d.r;
  const last = rm[rm.length - 1];
  if (audioOn && !document.hidden) {
    toast(`🦉 ${G[other(mySide)].n} moved!`);
    await doMove(last, true);
  } else {
    incoming = last; render(); showOwl(rm.length);
  }
}

async function boot() {
  const lp = new URLSearchParams(location.hash.slice(1)).get('lesson');
  if (lp) { const i = LESSONS.findIndex(l => l.id === lp); if (i >= 0) { if (es) { es.close(); es = null; } startLesson(i); return; } }
  LESSON = null;
  const g = parseHash();
  if (DB && g && !g.bot) {
    const d = await dbGet(g.id);
    const rm = remoteMoves(d);
    const p = new URLSearchParams(location.hash.slice(1));
    if (d && samePrefix(rm, g.moves) && (rm.length > g.moves.length || (d.r && !g.r))) {
      // the database is ahead of this link: open the latest position instead
      p.set('m', rm.join('')); if (d.r) p.set('r', d.r);
    }
    // names and houses come from the shared game, so a change on one iPad shows on both
    if (d && d.w && d.b) { p.set('wn', d.w.n); p.set('wh', d.w.h); p.set('bn', d.b.n); p.set('bh', d.b.h); }
    history.replaceState(null, '', '#' + p.toString());
  }
  loadFromHash();
  watch();
}

layout();
boot();
window.__wc = { tap: sq => handleTap(sq), get board() { return board3d; }, Chess, get sug() { return SUG; }, explain: u => explainMove(u), get chess() { return chess; }, get state() { return { mySide, orient, pending, passPlay, incoming, busy }; } };
